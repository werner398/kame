# Netlify publica el dashboard (frontend) desde la carpeta web/.
# No hay paso de build: es un único index.html.
[build]
  publish = "web"
  command = ""
  # Solo redesplegar si cambió algo dentro de web/ (los cambios del
  # backend los despliega Railway, no Netlify).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- web/ netlify.toml"
